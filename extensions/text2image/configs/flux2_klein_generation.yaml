inference:
  backbone: flux2_klein
  backbone_cfg:
    model_path: black-forest-labs/FLUX.2-klein-4B
    device: cuda:0
    torch_dtype: bfloat16
    local_files_only: true
    ephemeral_cache: false
  request:
    task: generation
    prompt: "A blue ceramic cup on a wooden table"
    output_path: output/flux2_klein_smoke.png
    params: {height: 1024, width: 1024, num_inference_steps: 4, guidance_scale: 1.0, seed: 42}
