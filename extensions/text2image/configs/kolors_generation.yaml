inference:
  backbone: kolors
  backbone_cfg:
    model_path: Kwai-Kolors/Kolors-diffusers
    device: cuda:0
    torch_dtype: bfloat16
    local_files_only: true
    ephemeral_cache: false
    trust_remote_code: true
  request:
    task: generation
    prompt: "A blue ceramic cup on a wooden table"
    output_path: output/kolors_smoke.png
    params: {height: 1024, width: 1024, num_inference_steps: 50, guidance_scale: 5.0, seed: 42}
