inference:
  backbone: sana_1_5
  backbone_cfg:
    model_path: Efficient-Large-Model/SANA1.5_4.8B_1024px_diffusers
    device: cuda:0
    torch_dtype: bfloat16
    local_files_only: true
    ephemeral_cache: false
  request:
    task: generation
    prompt: "A blue ceramic cup on a wooden table"
    output_path: output/sana_1_5_smoke.png
    params: {height: 1024, width: 1024, num_inference_steps: 18, guidance_scale: 5.0, pag_guidance_scale: 2.0, seed: 42}
