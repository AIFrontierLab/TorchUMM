inference:
  backbone: smolvlm_2b
  backbone_cfg:
    model_path: HuggingFaceTB/SmolVLM-Instruct
    device: cuda:0
    torch_dtype: bfloat16
  request:
    task: understanding
    prompt: "What is happening in this image?"
    images:
      - assets/torchumm_frame.png
    params:
      max_new_tokens: 256
