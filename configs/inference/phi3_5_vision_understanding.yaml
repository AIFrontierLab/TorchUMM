inference:
  backbone: phi3_5_vision
  backbone_cfg:
    model_path: microsoft/Phi-3.5-vision-instruct
    device: cuda:0
    torch_dtype: bfloat16
  request:
    task: understanding
    prompt: "What is happening in this image?"
    images:
      - assets/torchumm_frame.png
    params:
      max_new_tokens: 256
